<!doctype html>
<html lang="ru"><meta charset="utf-8"><style>
body{font:18px Arial;margin:28px;color:#1e293b;background:#f6f8fc}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 16px;border:1px solid #bcc9de;border-radius:8px;cursor:pointer;font:inherit;background:white}button:focus{outline:3px solid #91b5ff}section{margin-top:24px;background:white;padding:24px;border-radius:16px}pre{font:15px monospace;white-space:pre-wrap;background:#142237;color:#d9e9ff;padding:18px;border-radius:10px;line-height:1.6}#box{padding:24px;border:1px solid #bbb}#box.styled{background:#e0f2fe;color:#0369a1;border-radius:12px;border:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid div{padding:22px;background:#d1fae5;text-align:center}.narrow{grid-template-columns:1fr}small{color:#63748e}#count{font-size:64px;margin:20px}
</style><small>Учебная практика · выполнение в браузере</small>
<nav><button onclick="show('css')">CSS</button><button onclick="show('grid')">Grid</button><button onclick="show('js')">JavaScript</button><button onclick="show('async')">Async / Fetch</button></nav><main id="main"></main>
<script>
const main=document.querySelector('#main');
function show(t){
if(t==='css'){main.innerHTML='<section><h1>CSS: оформление блока</h1><pre>.box { background: #e0f2fe; padding: 24px;\nborder-radius: 12px; color: #0369a1; }</pre><div id="box"><h2>Привет, CSS!</h2><p>Один HTML — два варианта оформления.</p></div><p><button id="style">Применить CSS</button></p><p id="status">Состояние: без класса styled</p></section>';document.querySelector('#style').onclick=()=>{document.querySelector('#box').classList.toggle('styled');document.querySelector('#status').textContent='Класс styled: '+document.querySelector('#box').classList.contains('styled')}}
if(t==='grid'){main.innerHTML='<section><h1>Grid: меняем число столбцов</h1><pre>display: grid; gap: 12px;\ngrid-template-columns: repeat(3, 1fr);</pre><div class="grid" id="grid"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div><p><button id="layout">Один столбец</button></p><p id="status">Три столбца: repeat(3, 1fr)</p></section>';document.querySelector('#layout').onclick=()=>{document.querySelector('#grid').classList.toggle('narrow');document.querySelector('#status').textContent=document.querySelector('#grid').classList.contains('narrow')?'Один столбец: 1fr':'Три столбца: repeat(3, 1fr)'}}
if(t==='js'){main.innerHTML='<section><h1>JavaScript: события и состояние</h1><pre>let count = 0;\nbutton.onclick = () => {\n  count += 1;\n  output.textContent = count;\n};</pre><p id="count">0</p><button id="plus">Добавить 1</button> <button id="reset">Сбросить</button><p id="status">Ожидание нажатия</p></section>';let n=0;const render=()=>{document.querySelector('#count').textContent=n;document.querySelector('#status').textContent='Значение count = '+n};document.querySelector('#plus').onclick=()=>{n++;render()};document.querySelector('#reset').onclick=()=>{n=0;render()}}
if(t==='async'){main.innerHTML='<section><h1>Async / Await и Fetch</h1><pre>const response = await fetch(url);\nif (!response.ok) throw new Error(response.status);\nconst data = await response.json();</pre><button id="request">Получить JSON</button><pre id="output">Запрос ещё не отправлен.</pre><small>Источник: jsonplaceholder.typicode.com/todos/1</small></section>';document.querySelector('#request').onclick=async()=>{const output=document.querySelector('#output');output.textContent='Ожидание ответа…';try{const response=await fetch('https://jsonplaceholder.typicode.com/todos/1');if(!response.ok)throw Error(response.status);const data=await response.json();output.textContent='HTTP '+response.status+'\nPromise: fulfilled\n'+JSON.stringify(data,null,2)}catch(e){output.textContent='Promise: rejected\n'+e.message}}}
}
show('css');
</script></html>
