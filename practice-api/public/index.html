<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Практика REST API</title>
<style>
    body {
        font: 17px system-ui;
        max-width: 780px;
        margin: 60px auto;
        padding: 24px;
        background: #f5f7fb;
        color: #182339
    }

    section {
        background: white;
        padding: 28px;
        border-radius: 20px
    }

    input,
    button {
        font: inherit;
        padding: 12px;
        border: 1px solid #ccd3e0;
        border-radius: 8px
    }

    button {
        background: #2449c5;
        color: white;
        cursor: pointer
    }

    pre {
        background: #172238;
        color: #cde1ff;
        padding: 20px;
        white-space: pre-wrap;
        border-radius: 12px
    }

    small {
        color: #63718b
    }
</style>
<section><small>Учебная практика · Express</small>
    <h1>Запрос к API своими руками</h1>
    <p>Введите имя и создайте пользователя. Пустое имя вернёт ошибку 400.</p>
    <form id="form"><input id="name" placeholder="Имя" aria-label="Имя"><button>Создать · POST</button></form>
    <p><button id="load">Получить список · GET</button></p>
    <pre id="output" aria-live="polite">Нажмите кнопку, чтобы отправить запрос.</pre><small>Данные хранятся в памяти.
        После перезапуска сервера список очищается.</small>
</section>
<script>
    const output = document.querySelector('#output');
    async function send(method) {
        try {
            const r = await fetch('/api/users', {
                method,
                headers: {
                    'Content-Type': 'application/json'
                },
                ...(method === 'POST' ? {
                    body: JSON.stringify({ name: document.querySelector('#name').value })
                } : {})
            });

            output.textContent = `${method} /api/users → ${r.status}\n` + JSON.stringify(await r.json(), null, 2)
        } catch (e) {
            output.textContent = 'Не удалось подключиться к серверу: ' + e.message
        }
    }
    document.querySelector('#form').onsubmit = e => { e.preventDefault(); send('POST') };
    document.querySelector('#load').onclick = () => send('GET');
</script>

</html>
