name: Practice screenshots
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: study-password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: study-password
        options: >-
          --health-cmd "mysqladmin ping -pstudy-password"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL - tables, relation and JOIN
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres < practice-evidence/example.sql
      - name: MySQL - tables, relation and JOIN
        run: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -pstudy-password --table -e "CREATE DATABASE study;"
      - name: MySQL - execute SQL
        run: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -pstudy-password --table study < practice-evidence/example.sql
  firebase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install firebase-tools firebase-admin
        working-directory: practice-evidence/firebase
      - name: Firebase - Authentication, Firestore, Storage
        working-directory: practice-evidence/firebase
        run: npx firebase emulators:exec --project demo-study --only auth,firestore,storage "node check.cjs"
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app and capture actual emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          script: python3 practice-evidence/android_capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: evidence/
