name: API practice
on:
  push:
    paths: ["practice-api/**", ".github/workflows/api.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: practice-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Run Postman collection with Newman
        run: node run-tests.cjs
